<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캠프 쿵싯</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="./yt-shorts.ico" />

    <!-- 기본 SEO -->
    <meta
      name="description"
      content="청소년교회 여름캠프에서 함께했던 순간을 담은 짧은 영상입니다."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="캠프 쿵싯" />
    <meta
      property="og:description"
      content="여름캠프에서 함께했던 순간을 담았습니다."
    />
    <meta
      property="og:image"
      content="https://min-9.github.io/shorts/Y2FtcC1rdW5nc2l0/thumbnail-og.png"
    />
    <meta
      property="og:url"
      content="https://min-9.github.io/shorts/Y2FtcC1rdW5nc2l0/"
    />
    <meta property="og:site_name" content="캠프 쿵싯" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      body {
        background: black;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;
      }

      .player {
        position: relative;

        width: 100vw;
        height: 100vh;

        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Ambient Glow */
      .video-glow {
        position: absolute;

        width: 80vw;
        height: 90vh;

        border-radius: 2rem;

        background: radial-gradient(circle, white 0%, transparent 70%);

        filter: blur(160px);

        opacity: 0.25;

        transform: scale(1.2);

        transition: background 0.3s linear;

        pointer-events: none;

        z-index: 5;
      }

      /* 어두운 비네팅 */
      .bg-gradient {
        position: absolute;

        inset: 0;

        background: radial-gradient(
          circle,
          transparent 30%,
          rgba(0, 0, 0, 0.4) 100%
        );

        pointer-events: none;

        z-index: 6;
      }

      .video {
        position: relative;

        height: 100vh;

        aspect-ratio: 9 / 16;

        object-fit: contain;

        box-shadow: 0 0 120px rgba(255, 255, 255, 0.08);

        z-index: 10;
      }

      .paused-overlay {
        position: absolute;

        height: 100vh;
        aspect-ratio: 9 / 16;

        display: flex;

        justify-content: center;
        align-items: center;

        background: rgba(0, 0, 0, 0.28);

        z-index: 20;

        cursor: pointer;
      }

      .play-button {
        width: 0;
        height: 0;

        border-left: 42px solid white;
        border-top: 24px solid transparent;
        border-bottom: 24px solid transparent;

        margin-left: 8px;

        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
      }
    </style>
  </head>

  <body>
    <div class="player">
      <div class="video-glow"></div>

      <!-- <div class="bg-gradient"></div> -->

      <video class="video" loop playsinline>
        <source
          src="https://github.com/min-9/min-9.github.io/raw/refs/heads/main/shorts/Y2FtcC1rdW5nc2l0/output.mp4"
          type="video/mp4"
        />
      </video>

      <div class="paused-overlay">
        <div class="play-button"></div>
      </div>

      <canvas id="color-canvas" hidden></canvas>
    </div>

    <script>
      const video = document.querySelector('.video');

      const overlay = document.querySelector('.paused-overlay');

      const glow = document.querySelector('.video-glow');

      /*
        Canvas 설정
      */

      const canvas = document.querySelector('#color-canvas');

      const ctx = canvas.getContext('2d', {
        willReadFrequently: true,
      });

      canvas.width = 32;
      canvas.height = 32;

      /*
        현재 Glow 색상
      */

      const currentColor = {
        r: 255,
        g: 255,
        b: 255,
      };

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      /*
        영상 프레임에서 색 추출
      */

      function updateGlow() {
        if (video.readyState < 2) return;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const image = ctx.getImageData(0, 0, canvas.width, canvas.height);

        const data = image.data;

        let r = 0;
        let g = 0;
        let b = 0;

        const count = data.length / 4;

        for (let i = 0; i < data.length; i += 4) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
        }

        r /= count;
        g /= count;
        b /= count;

        /*
          색감 보정
        */

        r = Math.min(255, r * 1.2);
        g = Math.min(255, g * 1.2);
        b = Math.min(255, b * 1.2);

        /*
          부드러운 이동
        */

        currentColor.r = lerp(currentColor.r, r, 0.12);

        currentColor.g = lerp(currentColor.g, g, 0.12);

        currentColor.b = lerp(currentColor.b, b, 0.12);

        glow.style.background = `
          radial-gradient(
            circle,
            rgb(
              ${currentColor.r},
              ${currentColor.g},
              ${currentColor.b}
            ) 0%,
            transparent 70%
          )
          `;
      }

      /*
        영상 프레임마다 Glow 업데이트
      */

      function glowLoop() {
        updateGlow();

        if (video.requestVideoFrameCallback) {
          video.requestVideoFrameCallback(glowLoop);
        }
      }

      /*
        재생 / 정지
      */

      function updateOverlay() {
        overlay.style.display = video.paused ? 'flex' : 'none';
      }

      async function playVideo() {
        try {
          await video.play();

          if (video.requestVideoFrameCallback) {
            video.requestVideoFrameCallback(glowLoop);
          }
        } catch (error) {
          console.error(error);
        }
      }

      function pauseVideo() {
        video.pause();
      }

      function togglePlayback() {
        if (video.paused) {
          playVideo();
        } else {
          pauseVideo();
        }
      }

      overlay.addEventListener('click', togglePlayback);

      video.addEventListener('click', togglePlayback);

      video.addEventListener('play', updateOverlay);

      video.addEventListener('pause', updateOverlay);

      window.addEventListener('keydown', event => {
        if (event.code === 'Space') {
          event.preventDefault();
          togglePlayback();
        }
      });

      window.addEventListener('keydown', event => {
        if (event.code === 'KeyC') {
          event.preventDefault();
          if (video.hasAttribute('controls')) {
            video.removeAttribute('controls');
          } else {
            video.setAttribute('controls', true);
          }
        }
        if (event.code === 'KeyF') {
          event.preventDefault();
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            document.documentElement.requestFullscreen();
          }
        }
      });

      updateOverlay();
    </script>
  </body>
</html>
