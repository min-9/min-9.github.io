<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캠프 쿵싯</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="./yt-shorts.ico" />
    <!-- css -->
    <link rel="stylesheet" href="./style.css" />

    <!-- 기본 SEO -->
    <meta name="description" content="캠프에서 만들어진 또 하나의 추억" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="캠프 쿵싯" />
    <meta
      property="og:description"
      content="캠프에서 만들어진 또 하나의 추억"
    />
    <meta
      property="og:image"
      content="https://min-9.github.io/shorts/Y2FtcC1rdW5nc2l0/thumbnail-v0.png"
    />
    <meta
      property="og:url"
      content="https://min-9.github.io/shorts/Y2FtcC1rdW5nc2l0/"
    />
    <meta property="og:site_name" content="캠프 쿵싯" />
  </head>

  <body>
    <div class="player">
      <div class="video-glow"></div>

      <div class="bg-gradient"></div>

      <video
        class="video"
        preload="auto"
        poster="./poster.png"
        loop
        playsinline
      >
        <source src="./output.mp4" type="video/mp4" />
      </video>

      <div class="paused-overlay">
        <div class="play-button"></div>
      </div>

      <canvas id="color-canvas" hidden></canvas>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
